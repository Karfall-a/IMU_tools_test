complementary_filter_gain_node:
  ros__parameters:
    publish_tf: false
    reverse_tf: false
    fixed_frame: "odom"
    publish_debug_topics: true
    use_mag: true
    gain_acc: 0.02
    gain_mag: 0.00001
    do_bias_estimation: true
    bias_alpha: 0.01
    do_adaptive_gain: true
    constant_dt: 0.0
    orientation_stddev: 0.01
